# HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name chataffy.com www.chataffy.com dashboard.chataffy.com agent.chataffy.com;
    return 301 https://$host$request_uri;
}

# ============================================================
# Marketing site — chataffy.com / www → Next website :7000
# ============================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name chataffy.com www.chataffy.com;

    ssl_certificate /etc/letsencrypt/live/chataffy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chataffy.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;
    proxy_set_header X-Client-IP $remote_addr;

    # Backend API (dashboard uses https://chataffy.com/api)
    location /socket.io/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Legacy backend prefix (keep if still used)
    location /chataffy/chataffy/ {
        proxy_pass http://127.0.0.1:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /chataffy/superadmin {
        alias /var/www/chataffy.com/superadmin/dist/;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Marketing Next app
    location / {
        proxy_pass http://127.0.0.1:7000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# ============================================================
# Dashboard + agent — :9001
# ============================================================
